server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ims-backend
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/ims_db}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

# Management & Health Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# JWT Security Settings
app:
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlLWVudGVycHJpc2UtaW1zLXNlY3JldC1rZXktZXhhbXBsZS0yNTY=}
    expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    refresh-cookie-name: ${JWT_REFRESH_COOKIE_NAME:ims_refresh_token}
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  upload:
    dir: ${FILE_UPLOAD_DIR:./uploads/resumes}

# OpenAPI Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: INFO
    com.ims.backend: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: INFO
