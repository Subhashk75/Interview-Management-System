server:
  port: 0

spring:
  application:
    name: ims-backend-test
  datasource:
    url: jdbc:h2:mem:ims_test_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWV4YW1wbGUtMjU2LWJpdHMtbG9uZy1mb3Itand0LXRlc3Rz
    expiration-ms: 900000
    refresh-expiration-ms: 604800000
    refresh-cookie-name: ims_refresh_token
    refresh-cookie-secure: false
  cors:
    allowed-origins: http://localhost:3000
  upload:
    dir: ./target/test-uploads

logging:
  level:
    root: WARN
    com.ims.backend: INFO
